name: Godot Lint

on:
  push:
  pull_request:

jobs:
  lint-gdscript:
    name: gdformat + gdlint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit (Godot 4)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gdtoolkit==4.*"

      - name: Check formatting (gdformat)
        run: gdformat --check .
        continue-on-error: true

      - name: Lint GDScript (gdlint)
        run: gdlint .
